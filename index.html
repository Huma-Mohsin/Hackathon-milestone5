<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unique Path and Shareable Resume</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Unique Path and Shareable Resume</h1>

        <form id="resume-form">
            <fieldset>
                <legend>Personal Information</legend>
                <label for="picture">Profile Picture:</label>
                <input type="file" id="picture" accept="image/*" />
                <br />
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required />
                <br />
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required />
                <br />
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required />
            </fieldset>

            <fieldset id="education-section">
                <legend>Education</legend>
                <div id="education">
                    <label for="degree-0">Degree:</label>
                    <input type="text" id="degree-0" name="degree[]" required />
                    <label for="institution-0">Institution:</label>
                    <input type="text" id="institution-0" name="institution[]" required />
                    <label for="year-0">Year:</label>
                    <input type="text" id="year-0" name="year[]" required />
                </div>
                <button type="button" id="add-education">Add More Education</button>
            </fieldset>

            <fieldset id="work-section">
                <legend>Work Experience</legend>
                <div id="work">
                    <label for="job-title-0">Job Title:</label>
                    <input type="text" id="job-title-0" name="jobTitle[]" required />
                    <label for="company-0">Company:</label>
                    <input type="text" id="company-0" name="company[]" required />
                    <label for="work-year-0">Year:</label>
                    <input type="text" id="work-year-0" name="workYear[]" required />
                    <label for="description-0">Description:</label>
                    <textarea id="description-0" name="description[]" required></textarea>
                </div>
                <button type="button" id="add-work">Add More Work Experience</button>
            </fieldset>

            <fieldset id="skills-section">
                <legend>Skills</legend>
                <div id="skills">
                    <input type="text" id="skill-0" name="skills[]" required />
                </div>
                <button type="button" id="add-skill">Add More Skills</button>
            </fieldset>

            <button type="submit">Generate Resume</button>
        </form>

        <div id="resume-output" style="display: none;"></div>
       
    </div>

    <script src="script.js"></script>
</body>
</html>
